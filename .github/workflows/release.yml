name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-cli:
    name: Build CLI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runs-on: macos-latest
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
          - goos: windows
            goarch: arm64
            runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Build CLI
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          suffix=""
          if [ "${{ matrix.goos }}" = "windows" ]; then
            suffix=".exe"
          fi
          out_name="quesadilla-cli_${{ matrix.goos }}_${{ matrix.goarch }}${suffix}"
          mkdir -p .build/cli
          go build -o ".build/cli/${out_name}" ./cmd/cli

      - name: Upload CLI artifact
        uses: actions/upload-artifact@v4
        with:
          name: quesadilla-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: .build/cli/quesadilla-cli_${{ matrix.goos }}_${{ matrix.goarch }}*

  build-gui:
    name: Build GUI (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runs-on: ubuntu-latest
            artifact-name: quesadilla-gui_linux_amd64
          - goos: linux
            goarch: arm64
            runs-on: ubuntu-latest
            artifact-name: quesadilla-gui_linux_arm64
          - goos: darwin
            goarch: amd64
            runs-on: macos-latest
            artifact-name: quesadilla-gui_darwin_amd64
          - goos: darwin
            goarch: arm64
            runs-on: macos-latest
            artifact-name: quesadilla-gui_darwin_arm64
          - goos: windows
            goarch: amd64
            runs-on: windows-latest
            artifact-name: quesadilla-gui_windows_amd64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc libgl1-mesa-dev xorg-dev libxkbcommon-dev libwayland-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          if ! xcode-select -p >/dev/null 2>&1; then
            xcode-select --install || true
            echo "Please re-run after Xcode command line tools install"
            exit 1
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          # MinGW-w64 is typically available on GitHub Actions windows runners
          # If not, we'll add it to PATH
          if ! command -v gcc >/dev/null 2>&1; then
            echo "C:/msys64/mingw64/bin" >> $GITHUB_PATH
          fi

      - name: Build llama.cpp libraries
        if: runner.os != 'Windows'
        run: |
          make -C third_party/llama-go libbinding.a

      - name: Build llama.cpp libraries (macOS)
        if: runner.os == 'macOS'
        run: |
          make -C third_party/llama-go BUILD_TYPE=metal EXTRA_TARGETS= libbinding.a

      - name: Build llama.cpp libraries (Windows)
        if: runner.os == 'Windows'
        run: |
          # On Windows, the Makefile might need adjustments
          # For now, try the standard build
          make -C third_party/llama-go libbinding.a || echo "Windows llama.cpp build may need customization"

      - name: Build GUI
        env:
          CGO_ENABLED: 1
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p .build/gui
          # The macOS entry point is in cmd/macos, Linux in cmd/linux, Windows in cmd/windows
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            go build -o ".build/gui/${{ matrix.artifact-name }}" ./cmd/macos
          elif [ "${{ matrix.goos }}" = "linux" ]; then
            go build -o ".build/gui/${{ matrix.artifact-name }}" ./cmd/linux
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            go build -o ".build/gui/${{ matrix.artifact-name }}.exe" ./cmd/windows
          else
            echo "No GUI entry point found for ${{ matrix.goos }}. Skipping."
            touch ".build/gui/${{ matrix.artifact-name }}.placeholder"
          fi

      - name: Upload GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: .build/gui/${{ matrix.artifact-name }}*
          if-no-files-found: ignore